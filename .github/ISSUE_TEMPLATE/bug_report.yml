name: Bug report
description: Something returned the wrong data, errored, or crashed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you ask or call, and what came back?
      placeholder: 'Asked "who should I start" and get_lineup_projections returned an error...'
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Tool call
      description: The tool name and arguments, if you know them. Remove credentials, authorization headers, and private account responses. Share league IDs or usernames only if you are comfortable making them public.
      render: json
      placeholder: '{ "name": "get_roster", "arguments": { "league_id": "1234567890", "username": "someone" } }'
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `node dist/index.js --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Checkout commit
      description: Output of `git rev-parse HEAD` from the source checkout.
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Claude Code
        - Cursor
        - Windsurf
        - MCP Inspector
        - Other (say which below)
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - HTTP (--http)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant stderr output (lines starting with `[sleeper-mcp]`). Remove credentials, authorization headers, and private account data before posting.
      render: shell
