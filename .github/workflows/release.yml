name: Draft GitHub release

# Version tags validate the source and prepare a draft GitHub release.
# No package registry publication; see "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$expected" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != $expected"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI sanity
        run: node dist/index.js --version
      - name: Draft GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
