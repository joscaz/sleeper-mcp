name: Release

# Publishes to npm and creates a GitHub release when a v* tag is pushed
# (see "Releasing" in CONTRIBUTING.md). Needs an NPM_TOKEN repository secret
# until npm trusted publishing is configured for the package.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$expected" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != $expected"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
